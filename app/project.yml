name: FocusForge

options:
  bundleIdPrefix: com.focusforge
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"
  generateEmptyDirectories: true
  groupSortPosition: top

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  FocusForge:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FocusForge
        excludes:
          - "Preview Content"
      - path: FocusForge/Preview Content
        buildPhase: none
    dependencies:
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseRemoteConfig
    postBuildScripts:
      - name: Upload Crashlytics dSYMs
        script: |
          if [ "${CONFIGURATION}" = "Release" ]; then
            "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run" \
              -gsp "${PROJECT_DIR}/FocusForge/GoogleService-Info.plist" \
              -p ios "${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}"
          fi
        inputFiles:
          - "$(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)/Contents/Resources/DWARF/$(TARGET_NAME)"
          - "$(SRCROOT)/FocusForge/GoogleService-Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focusforge.app
        INFOPLIST_FILE: FocusForge/Info.plist
        CODE_SIGN_ENTITLEMENTS: FocusForge/FocusForge.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "YES"
        ENABLE_PREVIEWS: "YES"
    info:
      path: FocusForge/Info.plist
      properties:
        CFBundleDisplayName: FocusForge
        CFBundleName: FocusForge
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - processing
        NSUserNotificationsUsageDescription: "FocusForge needs notifications to alert you when your focus or break timer completes."
    entitlements:
      path: FocusForge/FocusForge.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: []

  FocusForgeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FocusForgeTests
    dependencies:
      - target: FocusForge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focusforge.app.tests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FocusForge.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/FocusForge"
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  FocusForge:
    build:
      targets:
        FocusForge: all
        FocusForgeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FocusForgeTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
