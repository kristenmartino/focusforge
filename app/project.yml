name: FocusForge

options:
  bundleIdPrefix: com.focusforge
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  FocusForge:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FocusForge
        excludes:
          - "Preview Content"
      - path: FocusForge/Preview Content
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focusforge.app
        INFOPLIST_FILE: FocusForge/Info.plist
        CODE_SIGN_ENTITLEMENTS: FocusForge/FocusForge.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "YES"
        ENABLE_PREVIEWS: "YES"
    info:
      path: FocusForge/Info.plist
      properties:
        CFBundleDisplayName: FocusForge
        CFBundleName: FocusForge
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - processing
        NSUserNotificationsUsageDescription: "FocusForge needs notifications to alert you when your focus or break timer completes."
    entitlements:
      path: FocusForge/FocusForge.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: []

schemes:
  FocusForge:
    build:
      targets:
        FocusForge: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
